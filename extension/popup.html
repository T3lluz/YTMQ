<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>YTMQ</title>
    <style>
      :root {
        color-scheme: dark;
      }
      html,
      body {
        margin: 0;
        width: 360px;
        background: #0a0a0a;
      }
      /* The popup is the surface; no floating card inside it. */
      #view.surface {
        border: 0;
        border-radius: 0;
        box-shadow: none;
        background: #181818;
        max-height: 580px;
        min-height: 220px;
        display: flex;
        flex-direction: column;
      }
    </style>
  </head>
  <body>
    <div id="view"></div>
    <script src="ui.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
