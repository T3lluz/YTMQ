# The app lives at https://t3lluz.com/ytmq (deployed by the server itself,
# see deploy/server). GitHub Pages only redirects old links there.
name: Pages redirect

on:
  push:
    branches: [main]
    paths: [deploy/pages/**, .github/workflows/deploy.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p site
          cp deploy/pages/index.html site/index.html
          cp deploy/pages/index.html site/404.html
          touch site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
