name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.6

      - name: Typecheck server
        working-directory: server
        run: deno check main.ts

      - name: Typecheck and build
        env:
          VITE_PUBLIC_SITE_URL: https://t3lluz.com/ytmq
          VITE_SPOTIFY_CLIENT_ID: example-spotify-client-id
        run: |
          set -euo pipefail
          node scripts/verify-bridge-urls.mjs
          npm run build
          node scripts/verify-dist-bridge.mjs
          test -f dist/index.html
          test -f dist/ytmusic-bridge.js
          test -f dist/ytmq-connect.user.js
          test -f dist/ytmq-extension.zip
          ! grep -qE 'src="/src/main\.tsx"|src="/src/main"' dist/index.html
